spring.application.name=thinkerlab-backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=ebook_app
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
app.auth.issuer=${SUPABASE_URL}/auth/v1
app.auth.jwks-uri=${SUPABASE_URL}/auth/v1/.well-known/jwks.json
app.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
