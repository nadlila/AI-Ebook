spring.datasource.url=jdbc:h2:mem:ebook;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/V001__initial_schema.sql
app.auth.issuer=https://test.supabase.co/auth/v1
app.auth.jwks-uri=https://test.supabase.co/auth/v1/.well-known/jwks.json
app.cors.origins=http://localhost:4200
